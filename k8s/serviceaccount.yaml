apiVersion: v1
kind: ServiceAccount
metadata:
  name: cloudops
  namespace: cloudops
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cloudops
  namespace: cloudops
rules: []
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cloudops
  namespace: cloudops
subjects:
  - kind: ServiceAccount
    name: cloudops
    namespace: cloudops
roleRef:
  kind: Role
  name: cloudops
  apiGroup: rbac.authorization.k8s.io
