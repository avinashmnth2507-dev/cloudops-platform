apiVersion: operator.tigera.io/v1
kind: Installation
metadata:
  name: default
spec:
  cni:
    type: Calico
    binDir: /var/lib/rancher/k3s/data/cni
    confDir: /var/lib/rancher/k3s/agent/etc/cni/net.d
  calicoNetwork:
    bgp: Disabled
    containerIPForwarding: Enabled
    ipPools:
      - name: default-ipv4-ippool
        cidr: 10.44.0.0/16
        encapsulation: VXLAN
        natOutgoing: Enabled
